name: Scientific and interface regressions
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'data/**'
      - 'tests/**'
      - 'competition-mode.js'
      - 'competition-mode.css'
      - 'map-refinement.js'
      - 'map-refinement.css'
      - 'blue-signature.css'
      - 'neutral-finish.css'
      - 'docs/**'
      - '.github/workflows/scientific-regression.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'src/**'
      - 'data/**'
      - 'tests/**'
      - 'competition-mode.js'
      - 'competition-mode.css'
      - 'map-refinement.js'
      - 'map-refinement.css'
      - 'blue-signature.css'
      - 'neutral-finish.css'
      - 'docs/**'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate IECON model calculations
        run: python tests/test_iecon_regression.py
      - name: Validate visual assets, map colors and links
        run: python tests/test_visual_contract.py
      - name: Verify JavaScript syntax
        run: |
          node --check competition-mode.js
          node --check map-refinement.js
          node --check src/app.js
